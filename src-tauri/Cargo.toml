[package]
name = "diligent-hours"
version = "0.5.1"
description = "DiligentHours — 첫 입력 감지 기반 근무시간 카운트다운"
edition = "2021"

[lib]
name = "diligent_hours_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

# Windows 는 주입 입력(INJECTED) 판별을 위해 저수준 훅을 직접 건다(hook.rs). rdev 는 그 외 플랫폼만.
[target.'cfg(not(windows))'.dependencies]
rdev = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
